name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cai Capacitor
        working-directory: android-app
        run: npm install

      - name: Tao project Android
        working-directory: android-app
        run: npx cap add android

      - name: Chep MainActivity (giu man hinh sang)
        working-directory: android-app
        run: cp MainActivity.java android/app/src/main/java/com/nhacqua/live/MainActivity.java

      - name: Cho phep ket noi http toi may tinh trong mang noi bo
        working-directory: android-app
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          grep -n usesCleartextTraffic android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Doi ten file
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk NhacTheoQua.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NhacTheoQua-apk
          path: NhacTheoQua.apk
          retention-days: 30
